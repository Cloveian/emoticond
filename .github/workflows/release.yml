name: release

# Push a tag vX.Y.Z (matching engine/Cargo.toml) to build emoticond for each
# target and attach the archives and SHA256SUMS to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: check the tag matches the version
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -1)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but engine/Cargo.toml is $v"; exit 1; }
      - name: build
        working-directory: engine
        run: cargo build --release --locked -p emoticond-cli --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name=emoticond-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp engine/target/${{ matrix.target }}/release/emoticond README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: emoticond-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum emoticond-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            emoticond-*.tar.gz
            SHA256SUMS
          body: |
            Binaries for Linux (x86_64, aarch64) and macOS (Apple silicon).
            Unpack, put `emoticond` on your PATH, then run `emoticond data fetch`.
