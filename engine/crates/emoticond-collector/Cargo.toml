[package]
name = "emoticond-collector"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The report collector: receives the reports emoticond front-ends send and stores them in SQLite"
publish = false

[dependencies]
emoticond = { path = "../emoticond", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
