[package]
name = "emoticond-compile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compile kaomoji source data into a .kmj data file"

[lib]
path = "src/lib.rs"

[[bin]]
name = "emoticond-compile"
path = "src/main.rs"

[dependencies]
emoticond = { path = "../emoticond" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.21"
