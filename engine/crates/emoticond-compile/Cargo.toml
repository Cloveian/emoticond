[package]
name = "emoticond-compile"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["kaomoji", "emoticon"]
categories = ["text-processing"]
description = "Compile emoticond source data into a .kmj data file"

[lib]
path = "src/lib.rs"

[[bin]]
name = "emoticond-compile"
path = "src/main.rs"

[dependencies]
emoticond = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.21"
