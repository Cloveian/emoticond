[package]
name = "emoticond-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "emoticond"
path = "src/main.rs"
doc = false

[dependencies]
emoticond = { path = "../emoticond", features = ["unstable-tuning"] }
emoticond-compile = { path = "../emoticond-compile" }
emoticond-config = { path = "../emoticond-config", features = ["unstable-tuning"] }
emoticond-state = { path = "../emoticond-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }

[features]
default = ["net"]
# Send queued reports to the collector (docs/collector.md). A build
# without it never sends: the packager's compile-time kill switch.
net = ["emoticond-state/net", "dep:ureq", "dep:sha2"]
