[package]
name = "emoticond-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "config.toml, policy.toml, env aliases and platform paths for the kaomoji library"

[dependencies]
emoticond = { path = "../emoticond" }
serde = "1"
serde_json = "1"
thiserror = "2.0.21"
toml = "1"

[features]
default = []
# Map [advanced.tuning] / EMOTICOND_TUNING_WEIGHTS onto SearchOptions.tuning (docs/options.md §3.4).
unstable-tuning = ["emoticond/unstable-tuning"]
