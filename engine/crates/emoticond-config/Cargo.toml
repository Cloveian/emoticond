[package]
name = "emoticond-config"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["kaomoji", "emoticon", "config"]
categories = ["config"]
description = "Config files, policy, environment and platform paths for emoticond"

[dependencies]
emoticond = { workspace = true }
serde = "1"
serde_json = "1"
thiserror = "2.0.21"
toml = "1"

[features]
default = []
# Map [advanced.tuning] / EMOTICOND_TUNING_WEIGHTS onto SearchOptions.tuning (docs/options.md §3.4).
unstable-tuning = ["emoticond/unstable-tuning"]
